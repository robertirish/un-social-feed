  <ellipse cx="18" cy="72" rx="4" ry="2.5" transform="rotate(20 18 72)"/>
  
  <!-- Right olive branch -->
  <path d="M85 75 Q75 60 70 50 Q75 40 85 25" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <ellipse cx="82" cy="35" rx="5" ry="3" transform="rotate(30 82 35)"/>
  <ellipse cx="80" cy="45" rx="5" ry="3" transform="rotate(20 80 45)"/>
  <ellipse cx="78" cy="55" rx="5" ry="3" transform="rotate(10 78 55)"/>
